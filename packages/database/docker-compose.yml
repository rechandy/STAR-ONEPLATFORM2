services:
  postgres:
    image: postgres:16-alpine
    container_name: oneplatform-postgres
    environment:
      POSTGRES_USER: oneplatform
      POSTGRES_PASSWORD: oneplatform
      POSTGRES_DB: oneplatform
    # Host port 5433 to avoid clashing with a host-installed PostgreSQL on 5432.
    ports:
      - "5433:5432"
    volumes:
      - oneplatform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneplatform -d oneplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oneplatform_pgdata:
