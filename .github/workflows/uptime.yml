name: uptime

# External uptime monitor for the live site. Runs on GitHub-hosted runners
# (independent of the VPS), every ~15 minutes. On failure it opens a GitHub
# issue assigned to the repo owner (which sends an email); on recovery it
# comments and closes that issue. Also runnable on demand from the Actions tab.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  issues: write

env:
  TARGET_URL: "https://ruben-star-one-platform.com/login"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe site
        id: probe
        run: |
          code=$(curl -sS -L --max-time 30 -o /dev/null -w "%{http_code}" "$TARGET_URL" || echo "000")
          echo "Probed $TARGET_URL -> $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "200" ]; then echo "up=true" >> "$GITHUB_OUTPUT"; else echo "up=false" >> "$GITHUB_OUTPUT"; fi

      - name: Alert or resolve
        uses: actions/github-script@v7
        with:
          script: |
            const up = '${{ steps.probe.outputs.up }}' === 'true';
            const code = '${{ steps.probe.outputs.code }}';
            const label = 'uptime-down';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label,
            });

            if (!up) {
              if (open.data.length === 0) {
                await github.rest.issues.create({
                  owner, repo,
                  title: `🔴 ruben-star-one-platform.com is DOWN (HTTP ${code})`,
                  labels: [label],
                  assignees: [owner],
                  body: [
                    `The uptime check failed at **${new Date().toISOString()}**.`,
                    ``,
                    `- URL: ${process.env.TARGET_URL}`,
                    `- HTTP status: \`${code}\``,
                    `- Run: ${runUrl}`,
                    ``,
                    `This issue auto-closes when the site recovers.`,
                  ].join('\n'),
                });
              }
              core.setFailed(`Site DOWN (HTTP ${code})`);
            } else {
              for (const iss of open.data) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: iss.number,
                  body: `✅ Recovered — HTTP 200 at ${new Date().toISOString()}.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: iss.number, state: 'closed',
                });
              }
            }
