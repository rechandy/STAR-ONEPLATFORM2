# Local Kafka-compatible broker (Redpanda) for the event backbone (ADR-0003).
# Usage:
#   docker compose -f infra/kafka/docker-compose.yml up -d
# then run student-record with:
#   EVENT_BROKER=kafka KAFKA_BROKERS=localhost:9092
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: oneplatform-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 12
